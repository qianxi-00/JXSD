[project]
name = "python-base-subprojects"
version = "0.1.0"
description = "Python_Base 核心项目分支：Agent / Crawler / RAG / Data_Analysis"
requires-python = ">=3.12"
dependencies = [
    # ---------- Agent 课案（LangGraph / LangChain / DeepAgents / MCP / Langfuse / 协议） ----------
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.2.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-prebuilt>=1.1.0",
    "deepagents>=0.7.13",
    "fastmcp>=3.4.7",
    "langfuse>=4.15.1",
    "openai==3.2.0",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    # ---------- RAG 项目（Milvus + Redis + BM25 + Chainlit + FastAPI） ----------
    "pymilvus>=3.0.1",
    "redis==7.4.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "chainlit>=2.12.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "loguru>=0.7.3",
    "requests==2.34.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    # ---------- Crawler（Scrapling 抓取 + 解析） ----------
    "scrapling[fetchers]==0.4.14",
    "beautifulsoup4==4.15.0",
    "html2text==2025.4.15",
    # ---------- Data_Analysis（NumPy / Pandas / Matplotlib + 笔记本） ----------
    "numpy==2.5.2",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "jupyterlab==4.6.3",
    # ---------- Agent 记忆依赖的 PostgreSQL 驱动（langgraph-checkpoint-postgres 使用） ----------
    "psycopg>=3.3.5",
    "psycopg-pool>=3.3.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
