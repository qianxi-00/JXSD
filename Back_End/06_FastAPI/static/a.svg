<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FastAPI 示例图片">
  <!-- 06_FastAPI/static/a.svg —— 演示"静态资源"：
       课案里用的是 /static/a.png，本仓库为了不引入二进制文件，改用等价的 SVG 图片。
       浏览器请求它时，StaticFiles 直接从磁盘读取并返回，不进入任何视图函数。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b4fd8"/>
      <stop offset="100%" stop-color="#22b8cf"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <path d="M22 44V20h12a8 8 0 0 1 0 16h-6" fill="none" stroke="#ffffff"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="44" r="4" fill="#ffffff"/>
</svg>
