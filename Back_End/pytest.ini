[pytest]
# ============================================================
# Back_End 目录的 pytest 配置
# ============================================================
# 放在 Back_End 下而不是仓库根目录，是为了"只影响本目录"，不干扰其他子项目。
# pytest 的运行逻辑：从命令行参数所在目录向上找 pytest.ini / pyproject.toml，
# 找到最近的配置文件后把它所在目录作为 rootdir。
#
# 常用运行方式：
#   & 'F:\ProGram\Python_Base\.venv\Scripts\python.exe' -m pytest 'F:\ProGram\Python_Base\Back_End' -q
#   & 'F:\ProGram\Python_Base\.venv\Scripts\python.exe' -m pytest 'F:\ProGram\Python_Base\Back_End\07_测试框架' -q

# asyncio_mode=auto：async def 测试函数不需要写 @pytest.mark.asyncio 也能运行
# （pytest-asyncio 已安装；显式写装饰器也依然有效）
asyncio_mode = auto

# 测试文件/类/函数的命名规则（pytest 默认值，这里显式写出来便于理解）
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 展示更清晰的失败信息：-ra 汇总所有非通过用例；-q 精简输出（在命令行里指定）
addopts = -ra --strict-markers

# 自定义标记声明（--strict-markers 要求所有 marker 必须在这里注册，防止拼写错误）
markers =
    slow: 耗时较长的用例（可用 -m "not slow" 跳过）
    integration: 需要外部服务（数据库/Redis 等）的集成测试

# 不递归进入这些目录（避免把示例脚本当成测试收集）
norecursedirs = data __pycache__ .venv

# 日志与警告
filterwarnings =
    ignore::DeprecationWarning
