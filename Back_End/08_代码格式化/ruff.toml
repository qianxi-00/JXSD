# ============================================================
# ruff.toml —— Ruff 的 Lint 与 Format 配置（带中文注释）
# ============================================================
# 用法：
#   1) 把本文件（或其中的配置项）复制到项目根目录 / Back_End 目录
#   2) uv run ruff check .               只检查
#      uv run ruff check --fix .         检查并自动修复
#      uv run ruff format .              格式化
#      uv run ruff format --check .      CI 里只检查不改
#
# 说明：本环境未安装 ruff，本文件仅作为配置示例与讲解。
# ============================================================

# ---------- 全局设置 ----------
line-length = 120               # 单行最大长度。PEP 8 建议 79，但中文注释 + 类型注解场景下太短
target-version = "py312"        # 目标 Python 版本：Ruff 据此给出"可以用新语法"的升级建议
indent-width = 4                # 缩进宽度（Python 必须 4 空格）
respect-gitignore = true        # 遵守 .gitignore，不检查被忽略的文件
exclude = [                     # 不检查的目录/文件（默认已排除 .venv/.git 等）
    ".venv",
    "data",
    "__pycache__",
    ".ipynb_checkpoints",
    "build",
    "dist",
]

# ---------- 检查（lint）设置 ----------
[lint]
# select：要启用的规则集。Ruff 用字母编号表示规则组，这里挑选了后端项目最实用的几组。
select = [
    "E",    # pycodestyle errors：缩进、空格、行尾等风格问题
    "W",    # pycodestyle warnings：行尾空格等
    "F",    # Pyflakes：未使用的 import/变量、未定义名称、f-string 缺占位符等**真 bug**
    "I",    # isort：import 排序与分组（替代独立的 isort 工具）
    "B",    # flake8-bugbear：可变默认参数、except 裸捕获等常见陷阱
    "C4",   # flake8-comprehensions：列表推导式/生成器的简化建议
    "UP",   # pyupgrade：把旧写法升级到目标 Python 版本的新语法
    "SIM",  # flake8-simplify：可以简化的 if/return 结构
    "RET",  # flake8-return：返回值写法的一致性
    "PTH",  # flake8-use-pathlib：建议用 pathlib 替代 os.path
    "T20",  # flake8-print：发现遗留的 print（生产代码应该用日志）
    "N",    # pep8-naming：命名规范（类名 CapWords、常量全大写等）
    "A",    # flake8-builtins：不要用内置名做变量名（如 list、id）
    "S",    # flake8-bandit：安全隐患（硬编码密码、assert 用于校验等）
]

# ignore：显式关闭的规则（每条都写清楚为什么关，避免"祖传配置没人敢动"）
ignore = [
    "E501",     # 行太长 —— 交给 ruff format 处理，lint 不再重复报警
    "S101",     # 使用 assert —— 教学示例与测试里大量使用 assert，属正常
    "T201",     # 使用 print —— 本课案的脚本以"打印讲解"为主要输出方式
    "N802",     # 函数名应当小写 —— FastAPI 路由函数偶尔需要驼峰以匹配外部约定
    "B008",     # 函数调用作为默认值 —— FastAPI 的 Depends()/Query() 正是这种写法
    "A003",     # 类属性遮蔽内置名 —— 例如 schemas 里的 type 字段
]

# 允许自动修复的规则（--fix 时生效）；设为空数组表示"只修 select 里标记为可修的规则"
fixable = ["ALL"]
unfixable = []

# dummy-variable-rgx：哪些变量名视为"故意不用"（不会被报未使用）
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# 测试文件放宽：允许 assert、允许魔术值、允许未使用的 fixture 参数
"test_*.py" = ["S101", "PLR2004", "ARG001", "F811"]
"conftest.py" = ["S101", "ARG001"]
"verify_*.py" = ["S101", "T201"]
"**/data/**" = ["ALL"]

[lint.isort]
known-first-party = ["config"]      # 根目录的 config.py 视为"本项目模块"，排在第三方之后
combine-as-imports = true           # 合并同一模块的多个 from ... import
force-sort-within-sections = true   # 段内按字母排序

[lint.pydocstyle]
convention = "google"               # 文档字符串风格（本仓库 docstring 接近 Google 风格）

# ---------- 格式化（format）设置：等价于 black 的核心风格 ----------
[format]
quote-style = "double"              # 统一使用双引号
indent-style = "space"              # 用空格缩进
skip-magic-trailing-comma = false   # 保留"魔法尾逗号"：多行结构末尾加逗号则保持多行
line-ending = "lf"                  # 强制 LF，跨平台协作不产生整文件 diff
docstring-code-format = true        # 顺便格式化 docstring 里的示例代码
