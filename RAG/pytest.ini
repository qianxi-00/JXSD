[pytest]
# ============================================================
# RAG 目录的 pytest 配置
# ============================================================
# 放在 RAG 下而不是仓库根目录，是为了"只影响本目录"，不干扰其他子项目。
# pytest 的运行逻辑：从命令行参数所在目录向上找 pytest.ini / pyproject.toml，
# 找到最近的配置文件后把它所在目录作为 rootdir。
#
# 常用运行方式（在 Python_Base 目录下）：
#   uv run pytest RAG -q
#   uv run pytest RAG -m "not live" -q        # 只跑离线单测（默认推荐）
#   uv run pytest RAG -m live -q              # 只跑真实 API/数据库用例

# asyncio_mode=auto：async def 测试函数不需要写 @pytest.mark.asyncio 也能运行
asyncio_mode = auto

# 测试文件/类/函数的命名规则（pytest 默认值，这里显式写出来便于理解）
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 展示更清晰的失败信息：-ra 汇总所有非通过用例
addopts = -ra --strict-markers

# 自定义标记声明（--strict-markers 要求所有 marker 必须在这里注册，防止拼写错误）
markers =
    slow: 耗时较长的用例（可用 -m "not slow" 跳过）
    integration: 需要本地外部服务（Milvus/Redis）的集成测试
    live: 需要真实外部 API（LLM/Embedding/Rerank）的用例，会产生调用费用

# 不递归进入这些目录（避免把数据/日志当测试收集）
# ⚠️ 写了这一行就会**覆盖** pytest 的默认值（默认里有 `.*`），所以点目录要自己列全：
#    少写 `.pytest_cache` 时，pytest 会去扫它，在权限受限的环境（如沙箱）里直接收集报错。
norecursedirs = data __pycache__ .venv .chainlit logs data_process .pytest_cache .ruff_cache

# 日志与警告
filterwarnings =
    ignore::DeprecationWarning
